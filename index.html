<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xcortex Event Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="container" id="app">
    <!-- Главная -->
    <div id="view-home">
        <h1>Xcortex Ticket</h1>
        <p class="subtitle">Система контроля доступа</p>
        <button class="btn-pri" onclick="showView('admin')">🛡 Панель Организатора</button>
    </div>

    <!-- Админ -->
    <div id="view-admin" class="hidden">
        <h1>Организатор</h1>
        <div style="display:flex; gap:5px; margin-bottom:15px;">
            <button class="tab-btn active" id="tab-nfc-reg" onclick="switchTab('nfc-reg')">💳 NFC Рег.</button>
            <button class="tab-btn" id="tab-qr-reg" onclick="switchTab('qr-reg')">📱 QR Рег.</button>
            <button class="tab-btn" id="tab-check" onclick="switchTab('check')">✅ Проверка</button>
        </div>

        <!-- Таб 1: NFC Регистрация -->
        <div id="panel-nfc-reg" class="tab-panel">
            <input type="text" id="input-name-nfc" class="form-input" placeholder="ФИО Участника">
            <button class="btn-pri" onclick="startRegisterNFC()">📱 Приложить карту</button>
            <div id="status-nfc-reg" class="status-box hidden"></div>
            <hr>
            <strong>База (<span id="count-users">0</span>)</strong>
            <div class="user-list" id="users-container"></div>
        </div>

        <!-- Таб 2: QR Регистрация -->
        <div id="panel-qr-reg" class="tab-panel hidden">
            <div id="qr-reg-idle">
                <button class="btn-pri" onclick="startRegistrationQR()">🚀 Выдать QR (60 сек)</button>
            </div>
            <div id="qr-reg-active" class="hidden">
                <div class="timer-box">⏳ <span id="reg-timer">60</span> сек.</div>
                <div id="invite-qr-container" class="qr-center"></div>
                <div id="qr-reg-status-msg" class="status-box st-info">Код сохранен.</div>
            </div>
        </div>

        <!-- Таб 3: Проверка Входа -->
        <div id="panel-check" class="tab-panel hidden">
            <button class="btn-pri" onclick="startCheckNFC()">💳 Сканировать NFC</button>
            <button class="btn-sec" onclick="openScanner()">📷 Сканировать QR</button>
            <div id="scanner-view" class="hidden"><div id="reader"></div><button class="btn-danger btn-small" onclick="closeScanner()">Стоп</button></div>
            <div id="check-result" class="status-box hidden"></div>
        </div>

        <a href="#" onclick="showView('home')" class="back-link">← Выход</a>
    </div>

    <!-- Клиент (Скрытый блок) -->
    <div id="view-client-login" class="hidden">
        <h1>Ваш Пропуск</h1>
        <div id="client-ticket-qr" class="qr-center large-qr"></div>
        <div class="status-box st-ok" style="text-align:center;">Код: <strong id="client-code-display"></strong></div>
        <button class="btn-sec" onclick="window.close()">Закрыть</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
