<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xcortex Admin</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Библиотеки CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="app-wrapper">
    <div class="app-card">
        
        <!-- ЭКРАН ВХОДА -->
        <div id="view-login">
            <h1>Xcortex Ticket</h1>
            <p class="subtitle">Панель Организатора v10.1 Modular</p>
            <button class="btn-primary" onclick="enterApp()">🛡 Войти в систему</button>
        </div>

        <!-- АДМИНСКАЯ ПАНЕЛЬ -->
        <div id="view-admin" style="display:none;">
            <h2>Организатор</h2>
            
            <!-- Навигация -->
            <!-- Навигация -->
<nav class="tabs-nav">
    <!-- ВАЖНО: Добавлен onclick к каждой кнопке -->
    <button class="tab-btn active" data-tab="nfc" onclick="switchTab('nfc')">💳 NFC</button>
    <button class="tab-btn" data-tab="qr" onclick="switchTab('qr')">📱 QR</button>
    <button class="tab-btn" data-tab="check" onclick="switchTab('check')">✅ Вход</button>
    <button class="tab-btn" data-tab="db" onclick="switchTab('db')">📋 База</button>
</nav>

            <!-- КОНТЕЙНЕРЫ ВКЛАДОК -->
            
            <!-- 1. NFC Регистрация -->
            <section id="tab-nfc" class="tab-panel active">
                <label for="in-nfc-name">ФИО участника:</label>
                <input type="text" id="in-nfc-name" placeholder="Иванов Иван">
                
                <button class="btn-primary" onclick="registerNFC()">➕ Привязать карту</button>
                <button class="btn-secondary" onclick="searchNFC()">🔍 Найти по карте</button>
                
                <div id="msg-nfc" class="message-box hidden"></div>
                
                <hr class="divider">
                
                <div class="list-header">
                    <strong>Зарегистрированные карты</strong>
                    <span class="badge" id="cnt-nfc">0</span>
                </div>
                <div id="list-nfc" class="data-list"></div>
            </section>

            <!-- 2. QR Генерация -->
            <section id="tab-qr" class="tab-panel hidden">
                <label for="in-qr-name">ФИО клиента (без карты):</label>
                <input type="text" id="in-qr-name" placeholder="Петров Петр">
                
                <button class="btn-primary" onclick="generateQR()">🚀 Создать билет</button>
                
                <div id="area-qr-result" class="result-area hidden">
                    <p><strong id="txt-qr-name"></strong></p>
                    <div id="box-qr-img" class="qr-container"></div>
                    <p class="big-code" id="txt-qr-code">000000</p>
                    <small>Пусть клиент сфотографирует этот экран.</small>
                    <br><br>
                    <button class="btn-secondary btn-small" onclick="resetQRForm()">Новый клиент</button>
                </div>
            </section>

            <!-- 3. Проверка Входа -->
            <section id="tab-check" class="tab-panel hidden">
                <button class="btn-primary" onclick="checkNFCAccess()">💳 Сканировать NFC</button>
                <button class="btn-secondary" onclick="startCameraScan()">📷 Сканировать QR</button>
                
                <div id="cam-view" class="camera-view hidden">
                    <div id="reader-element"></div>
                    <button class="btn-danger btn-small" onclick="stopCameraScan()">Стоп камера</button>
                </div>

                <div id="msg-check" class="message-box hidden"></div>
            </section>

            <!-- 4. Общая База -->
            <section id="tab-db" class="tab-panel hidden">
                <div class="list-header">
                    <strong>Все выданные билеты</strong>
                    <span class="badge" id="cnt-all">0</span>
                </div>
                <div id="list-db" class="data-list"></div>
                
                <button class="btn-danger" onclick="wipeDatabase()" style="margin-top:15px;">🗑 Очистить базу данных</button>
            </section>

            <br>
            <a href="#" onclick="logoutApp()" class="back-link">← Выход из панели</a>
        </div>

    </div>
</div>

<!-- Подключаем логику ПОСЛЕ всего контента -->
<script src="script.js"></script>

</body>
</html>
